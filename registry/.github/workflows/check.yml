# Every pull request runs the acceptance bar over every entry. All of them
# rather than the diff: an entry that regresses because a check tightened
# should be found by CI, not by the next contributor.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  submissions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The bar is code inside the SlipX distribution, so the registry
      # checks with whatever SlipX release is current; pin here only if a
      # check change ever needs staging.
      - run: pip install slipx pyyaml
      - run: python tools/check_submission.py
