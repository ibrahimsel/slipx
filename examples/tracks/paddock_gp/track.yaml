# A generated track.
#
# NOTHING HERE WAS SURVEYED. The geometry is exact because a script produced
# it from a segment list, not because anybody measured a real place; there is
# no real place. It exists so the racing demos have a circuit worth racing on
# without SlipX redistributing somebody else's geometry, which it may not do
# (ADR-0035, ADR-0057). CI and the test suites assert against the stadium
# next door; this one is for watching.
#
# To run on a real venue, convert one into place with
# tools/convert_track.py. The converter writes the geometry block below from
# the source it fetched, so a converted track states whose data it is.

schema_version: "0.3.0"
name: paddock_gp
description: >-
  A circuit: a 26 m start straight, a 3.5 m sweeper, a bus-stop chicane that
  pinches to 1.4 m, a 1.6 m hairpin behind the widest braking zone on the
  lap, and a return elbow; one lap 100.891 m. Shaped so a field spreads out
  and earns its passes: the corners are unequal, and the width varies from
  2.2 m where a move can be tried to 1.4 m where it cannot.

# The surface identifier, not a friction coefficient. It pairs with a tyre
# compound to select the tyre file that carries mu (ADR-0010), which is why
# the reference car's sponge-on-carpet tyres run here and a set identified on
# asphalt is refused.
surface: carpet

# Declared, never inferred from the geometry. The last centreline point does
# not repeat the first, so the closing chord is implied by this line and by
# nothing else.
closed: true

centreline: centreline.csv

geometry:
  source: >-
    Generated by examples/tracks/make_tracks.py in this repository. Not a
    real venue, and not derived from anybody else's map.
  licence: Apache-2.0
  notes: >-
    Regenerate with python3 examples/tracks/make_tracks.py. The script
    asserts the geometry it writes: the segment walk closes exactly, every
    point lies on its segment, the varying width stays inside what each
    corner radius allows, and no two parts of the lap come close enough for
    their walls to meet.

provenance:
  schema_version: "0.3.0"
  label: provisional
  source: >-
    A script and a segment list. No track was measured, and this one does
    not exist outside this repository.
  method: >-
    Exact construction from thirteen straights and arcs, sampled at a
    uniform 0.05 m of arc length, with the half-width interpolated between
    declared knots.
  date: "2026-08-20"
  notes: >-
    The dimensions are plausible for a large sports hall rather than copied
    from a venue. A converted real track is the thing to cross-check a
    fitted parameter set against; this one is for making twenty cars race.
