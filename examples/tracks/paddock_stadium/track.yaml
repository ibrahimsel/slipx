# A generated track.
#
# NOTHING HERE WAS SURVEYED. The geometry is exact because a script produced
# it from four numbers, not because anybody measured a real place; there is no
# real place. It exists so that the loader, the tests, CI and the examples
# have a track to open without SlipX redistributing somebody else's geometry,
# which it may not do: every public centreline set in this format is copyleft,
# and the F1TENTH maps of real venues carry no licence at all (ADR-0035).
#
# To run on a real venue, convert one into place with
# tools/convert_track.py. The converter writes the geometry block below from
# the source it fetched, so a converted track states whose data it is.

schema_version: "0.3.0"
name: paddock_stadium
description: >-
  A stadium: two 8 m straights joined by two semicircular ends of 3 m radius,
  1.5 m wide, one lap 34.85 m. Shaped to give a lap counter a closed loop, a
  pure pursuit controller curvature that changes, and a wall follower a
  straight long enough to settle on.

# The surface identifier, not a friction coefficient. It pairs with a tyre
# compound to select the tyre file that carries mu (ADR-0010), which is why
# the reference car's sponge-on-carpet tyres run here and a set identified on
# asphalt is refused.
surface: carpet

# Declared, never inferred from the geometry. The last centreline point does
# not repeat the first, so the closing chord is implied by this line and by
# nothing else.
closed: true

centreline: centreline.csv

geometry:
  source: >-
    Generated by examples/tracks/make_tracks.py in this repository. Not a real
    venue, and not derived from anybody else's map.
  licence: Apache-2.0
  notes: >-
    Regenerate with python3 examples/tracks/make_tracks.py. The script asserts
    the geometry it writes: every point on the shape, no coincident points,
    and a polyline within a millimetre of the true lap length.

provenance:
  schema_version: "0.3.0"
  label: provisional
  source: >-
    A script and four numbers. No track was measured, and this one does not
    exist outside this repository.
  method: >-
    Exact construction: two straights of 8 m and two semicircles of 3 m
    radius, sampled at a uniform 0.1 m of arc length.
  date: "2026-08-15"
  notes: >-
    The dimensions are plausible for a sports hall rather than copied from a
    venue. A converted real track is the thing to cross-check a fitted
    parameter set against; this one is for making the machinery run.
