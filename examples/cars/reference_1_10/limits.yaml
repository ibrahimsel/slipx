# Actuator and electrical limits.
#
# Separate from dynamics.yaml because these are properties of the hardware
# fitted: changing the servo or the battery changes this file and nothing else.
#
# Several fields here are validated but not yet consumed. The ESC and servo
# models are CORE-08 and CORE-10 and arrive with L2 in P1. They are written now
# so that a team measuring their car has somewhere to put the numbers, and so
# that this directory does not need editing when L2 lands.
#
# PROVISIONAL. See provenance.yaml.

schema_version: "0.1.0"

steering:
  # Road wheel travel, symmetric magnitude. About 23 degrees, which is typical
  # of a 1/10 chassis at full lock.                                    [rad]
  max_angle: 0.40

  # Consumed from L2 (CORE-10). A digital servo of the class usually fitted
  # slews roughly 60 degrees in 0.1 s under no load.                 [rad/s]
  max_rate: 10.0
  bandwidth: 45.0    # second-order natural frequency               [rad/s]
  damping: 0.7       #                                                  [-]

drivetrain:
  # At L0 and L1 these three are the whole drivetrain model. From L2 the ESC
  # torque-speed curve supersedes accel_max, which becomes a bound rather than
  # the mechanism.
  accel_max: 8.0     #                                             [m/s^2]
  decel_max: 12.0    # positive magnitude                          [m/s^2]
  v_max: 20.0        # mechanical top speed                          [m/s]

electrical:
  # Consumed from L2 (CORE-08, CORE-09). Battery sag is what makes the last
  # lap slower than the first; a car tuned without it is tuned for a battery
  # state that lasts thirty seconds.
  pack_nominal_v: 11.1            # 3S lithium polymer                 [V]
  pack_capacity_ah: 5.2           #                                  [A h]
  pack_internal_resistance: 0.020 #                                  [ohm]
  current_max: 120.0              #                                    [A]
  regen_current_max: 40.0         # its own limit, well below drive   [A]
