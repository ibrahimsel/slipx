# Sponge tyre on carpet.
#
# One (compound, surface) pair. This file is a property of the tyre and the
# surface, not of the car wearing it, which is why cornering stiffness is
# stated per tyre rather than per axle: an axle has two of them, and the number
# of tyres on an axle is the car's business.
#
# PROVISIONAL. Nothing here was measured. Every parameter is one that COULD be
# identified from a manoeuvre drivable in a car park with the sensors already
# on a competition car, which is the whole point of the list; none of them has
# been.

schema_version: "0.2.0"

compound: sponge
surface: carpet

# Static load per tyre on a 3.5 kg car with 50/50 weight distribution,
# exactly: 3.5 * 9.80665 / 4. The friction and stiffness numbers below are
# stated at this load; without it they are not stated at anything. Written to
# the digit rather than rounded so that the loader's load restatement
# (ADR-0039) is the identity for the reference pairing and every number below
# loads exactly as written.                                              [N]
nominal_load: 8.58081875

linear:
  # Cornering stiffness per tyre at the nominal load, positive. The restoring
  # sign lives in the force law, Fy = -C_alpha * alpha (ISO 8855), not here.
  # Identifiable from the low-slip region of a skidpad.               [N/rad]
  c_alpha: 210.0

  # Longitudinal slip stiffness per tyre at the nominal load: the initial
  # slope of longitudinal force against slip ratio. Identifiable from encoder
  # slip ratio against IMU longitudinal acceleration in a straight-line run.
  # Provisional. It was set at twice c_alpha, the usual ratio between the two
  # slopes, and ADR-0032 then raised c_alpha without following it here: the
  # two are identified by different manoeuvres, so tying them together would
  # couple parameters the measurement keeps apart. The ratio no longer holds
  # and this number stands on its own.
  # Consumed from L2 (schema 0.2.0).                     [N per unit slip]
  c_kappa: 120.0

friction:
  # Peak lateral and longitudinal friction at the nominal load. Sponge on
  # carpet grips well; above 1 is normal for this combination and would be
  # suspicious on asphalt.                                                [-]
  mu_y0: 1.10
  mu_x0: 1.05

  # Load sensitivity exponent: mu = mu_0 * (Fz / nominal_load)^(-k_mu).
  # Identifiable from a skidpad at two ballast configurations, which is why it
  # is in the list and Pacejka's several load-dependence terms are not.
  # Consumed from L2 (CORE-06).                                           [-]
  k_mu: 0.15

# Reduced Magic Formula shape factors, consumed from L2. B is deliberately
# absent: the model derives it from c_alpha and the static load so that the
# curve reproduces the linear tyre exactly at small slip, and a stated B would
# either agree (redundant) or disagree (ignored, and warned about).
#
# C and E together set where the peak sits relative to the slip angle at which
# the linear tyre saturates: this pair puts it at about 2.7 times, inside the
# 1.5 to 3 a real tyre shows. The pair is easy to get wrong in a way every
# individual bound accepts, so the loader checks the multiple.
mf_lite:
  C: 1.68
  E: 0.42

relaxation:
  # The distance the tyre must roll for lateral force to reach 63% of its
  # steady value. Of the order of the contact patch length. Identifiable from
  # the step-steer transient. Consumed from L2 (CORE-07).                 [m]
  sigma: 0.045

provenance:
  schema_version: "0.2.0"
  label: provisional
  source: >-
    No tyre. Values chosen so that the implied saturation slip angle and the
    shape of the curve are typical of a small sponge tyre on carpet.
  method: >-
    Plausibility reasoning. No slip sweep was driven and no force was measured.
  date: "2026-08-01"
  notes: >-
    A fitted replacement for this file is the single most valuable thing an
    outside contributor could produce, and it needs no equipment beyond a car,
    a carpet and a rosbag.
