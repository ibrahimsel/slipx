<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-label="Clipping each axis against projecting onto the budget">
<title>Clipping each axis against projecting onto the budget</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<style>
  :root {
    --paper:#ffffff; --fg:#14181d; --muted:#5b6672; --grid:#e3e7ec;
    --accent:#c2410c; --accent2:#1d4ed8; --ok:#15803d; --warn:#a16207;
    --body:#cfd6de; --road:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#11161c; --fg:#e8ecf1; --muted:#93a0ad; --grid:#2a323b;
      --accent:#fb923c; --accent2:#7aa7ff; --ok:#4ade80; --warn:#eab308;
      --body:#2b333c; --road:#1a2027;
    }
  }
  .card { fill: var(--paper); }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .axis { stroke: var(--muted); stroke-width: 1.3; fill: none; }
  .mut  { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .fg   { stroke: var(--fg); stroke-width: 1.6; fill: none; }
  .body { fill: var(--body); stroke: var(--muted); stroke-width: 1.1; }
  .road { fill: var(--road); stroke: var(--grid); stroke-width: 1.1; }
  .a1   { stroke: var(--accent);  stroke-width: 2.2; fill: none; }
  .a2   { stroke: var(--accent2); stroke-width: 2.2; fill: none; }
  .ok   { stroke: var(--ok);      stroke-width: 2.2; fill: none; }
  .a1f  { fill: var(--accent);  stroke: none; }
  .a2f  { fill: var(--accent2); stroke: none; }
  .okf  { fill: var(--ok);      stroke: none; }
  .dash { stroke-dasharray: 7 5; }
  .dot  { stroke-dasharray: 2 4; }
  .thin { stroke-width: 1.2; }
  text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
  .t    { font-size: 13px; }
  .ts   { font-size: 11.5px; fill: var(--muted); }
  .tb   { font-size: 15px; font-weight: 600; }
  .tm   { font-size: 12px; fill: var(--muted); }
  .k1   { font-size: 12px; fill: var(--accent); }
  .k2   { font-size: 12px; fill: var(--accent2); }
  .k3   { font-size: 12px; fill: var(--ok); }
  .sb   { font-size: 0.72em; }
</style>
<rect class="card" x="0" y="0" width="640" height="470" rx="10"/>
<text class="tb" x="22.00" y="28.00">Combined slip: two ways to run out of grip</text>
<text class="tm" x="22.00" y="47.00">Each demand is legal on its own axis. Together they are not.</text>
<ellipse class="a1" cx="270" cy="230" rx="150" ry="118"/>
<line class="axis" x1="80.00" y1="230.00" x2="460.00" y2="230.00"/>
<line class="axis" x1="270.00" y1="76.00" x2="270.00" y2="388.00"/>
<text class="ts" x="466.00" y="252.00">F<tspan class="sb" dy="3">y</tspan></text>
<text class="ts" x="282.00" y="70.00">F<tspan class="sb" dy="3">x</tspan></text>
<text class="ts" x="256.00" y="378.00" text-anchor="end">brake</text>
<line class="grid dot" x1="397.13" y1="230.00" x2="397.13" y2="321.68"/>
<line class="grid dot" x1="270.00" y1="321.68" x2="397.13" y2="321.68"/>
<text class="k2" x="403.13" y="220.00">8.0 N of 9.4</text>
<text class="k2" x="262.00" y="325.68" text-anchor="end">7.0 N of 9.0</text>
<line class="ok" x1="270.00" y1="230.00" x2="380.57" y2="309.74" marker-end="url(#ah)"/>
<line class="a2 dash" x1="380.57" y1="309.74" x2="397.13" y2="321.68" marker-end="url(#ah)"/>
<circle class="a2f" cx="397.13" cy="321.68" r="5.00"/>
<circle class="okf" cx="380.57" cy="309.74" r="5.00"/>
<text class="k2" x="411.13" y="331.68">clipped per axis</text>
<text class="ts" x="411.13" y="347.68">asks 10.6 N of the patch</text>
<text class="k3" x="270.00" y="404.00" text-anchor="middle">projected onto the boundary</text>
<text class="ts" x="270.00" y="420.00" text-anchor="middle">7.0 N and 6.1 N, in the direction asked for</text>
<text class="ts" x="22.00" y="448.00">Both components scale by the same factor, so the direction survives and the magnitude does not.</text>
</svg>
