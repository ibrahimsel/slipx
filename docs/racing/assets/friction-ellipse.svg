<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-label="The friction ellipse: one budget, two demands">
<title>The friction ellipse: one budget, two demands</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<style>
  :root {
    --paper:#ffffff; --fg:#14181d; --muted:#5b6672; --grid:#e3e7ec;
    --accent:#c2410c; --accent2:#1d4ed8; --ok:#15803d; --warn:#a16207;
    --body:#cfd6de; --road:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#11161c; --fg:#e8ecf1; --muted:#93a0ad; --grid:#2a323b;
      --accent:#fb923c; --accent2:#7aa7ff; --ok:#4ade80; --warn:#eab308;
      --body:#2b333c; --road:#1a2027;
    }
  }
  .card { fill: var(--paper); }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .axis { stroke: var(--muted); stroke-width: 1.3; fill: none; }
  .mut  { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .fg   { stroke: var(--fg); stroke-width: 1.6; fill: none; }
  .body { fill: var(--body); stroke: var(--muted); stroke-width: 1.1; }
  .road { fill: var(--road); stroke: var(--grid); stroke-width: 1.1; }
  .a1   { stroke: var(--accent);  stroke-width: 2.2; fill: none; }
  .a2   { stroke: var(--accent2); stroke-width: 2.2; fill: none; }
  .ok   { stroke: var(--ok);      stroke-width: 2.2; fill: none; }
  .a1f  { fill: var(--accent);  stroke: none; }
  .a2f  { fill: var(--accent2); stroke: none; }
  .okf  { fill: var(--ok);      stroke: none; }
  .dash { stroke-dasharray: 7 5; }
  .dot  { stroke-dasharray: 2 4; }
  .thin { stroke-width: 1.2; }
  text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
  .t    { font-size: 13px; }
  .ts   { font-size: 11.5px; fill: var(--muted); }
  .tb   { font-size: 15px; font-weight: 600; }
  .tm   { font-size: 12px; fill: var(--muted); }
  .k1   { font-size: 12px; fill: var(--accent); }
  .k2   { font-size: 12px; fill: var(--accent2); }
  .k3   { font-size: 12px; fill: var(--ok); }
  .sb   { font-size: 0.72em; }
</style>
<rect class="card" x="0" y="0" width="560" height="400" rx="10"/>
<text class="tb" x="22.00" y="28.00">The friction ellipse</text>
<text class="tm" x="22.00" y="47.00">Braking and cornering spend the same contact patch.</text>
<ellipse class="a1" cx="268" cy="224" rx="158" ry="108"/>
<line class="axis" x1="68.00" y1="224.00" x2="472.00" y2="224.00"/>
<line class="axis" x1="268.00" y1="70.00" x2="268.00" y2="378.00"/>
<text class="ts" x="480.00" y="228.00">F<tspan class="sb" dy="3">y</tspan></text>
<text class="ts" x="280.00" y="64.00">F<tspan class="sb" dy="3">x</tspan></text>
<text class="ts" x="256.00" y="64.00" text-anchor="end">drive</text>
<text class="ts" x="256.00" y="382.00" text-anchor="end">brake</text>
<line class="a2" x1="268.00" y1="224.00" x2="426.00" y2="224.00" marker-end="url(#ah)"/>
<circle class="a2f" cx="426.00" cy="224.00" r="4.50"/>
<text class="k2" x="412.00" y="210.00" text-anchor="end">pure cornering</text>
<line class="ok" x1="268.00" y1="224.00" x2="356.35" y2="313.54" marker-end="url(#ah)"/>
<circle class="okf" cx="356.35" cy="313.54" r="4.50"/>
<line class="grid dot" x1="356.35" y1="313.54" x2="356.35" y2="224.00"/>
<line class="grid dot" x1="356.35" y1="313.54" x2="268.00" y2="313.54"/>
<text class="k3" x="370.35" y="319.54">combined:</text>
<text class="ts" x="370.35" y="334.54">braking and cornering</text>
<circle class="a1f" cx="194.00" cy="262.00" r="4.50"/>
<text class="ts" x="184.00" y="266.00" text-anchor="end">grip in hand</text>
</svg>
