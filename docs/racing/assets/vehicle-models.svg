<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" role="img" aria-label="Three vehicle models of increasing fidelity">
<title>Three vehicle models of increasing fidelity</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<style>
  :root {
    --paper:#ffffff; --fg:#14181d; --muted:#5b6672; --grid:#e3e7ec;
    --accent:#c2410c; --accent2:#1d4ed8; --ok:#15803d; --warn:#a16207;
    --body:#cfd6de; --road:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#11161c; --fg:#e8ecf1; --muted:#93a0ad; --grid:#2a323b;
      --accent:#fb923c; --accent2:#7aa7ff; --ok:#4ade80; --warn:#eab308;
      --body:#2b333c; --road:#1a2027;
    }
  }
  .card { fill: var(--paper); }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .axis { stroke: var(--muted); stroke-width: 1.3; fill: none; }
  .mut  { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .fg   { stroke: var(--fg); stroke-width: 1.6; fill: none; }
  .body { fill: var(--body); stroke: var(--muted); stroke-width: 1.1; }
  .road { fill: var(--road); stroke: var(--grid); stroke-width: 1.1; }
  .a1   { stroke: var(--accent);  stroke-width: 2.2; fill: none; }
  .a2   { stroke: var(--accent2); stroke-width: 2.2; fill: none; }
  .ok   { stroke: var(--ok);      stroke-width: 2.2; fill: none; }
  .a1f  { fill: var(--accent);  stroke: none; }
  .a2f  { fill: var(--accent2); stroke: none; }
  .okf  { fill: var(--ok);      stroke: none; }
  .dash { stroke-dasharray: 7 5; }
  .dot  { stroke-dasharray: 2 4; }
  .thin { stroke-width: 1.2; }
  text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
  .t    { font-size: 13px; }
  .ts   { font-size: 11.5px; fill: var(--muted); }
  .tb   { font-size: 15px; font-weight: 600; }
  .tm   { font-size: 12px; fill: var(--muted); }
  .k1   { font-size: 12px; fill: var(--accent); }
  .k2   { font-size: 12px; fill: var(--accent2); }
  .k3   { font-size: 12px; fill: var(--ok); }
  .sb   { font-size: 0.72em; }
</style>
<rect class="card" x="0" y="0" width="700" height="330" rx="10"/>
<text class="tb" x="22.00" y="28.00">The modelling ladder</text>
<text class="tm" x="22.00" y="47.00">Each rung adds a mechanism, and a reason not to trust the rung below it.</text>
<text class="t" x="116.00" y="92.00" text-anchor="middle">Kinematic bicycle</text>
<text class="ts" x="116.00" y="110.00" text-anchor="middle">4 states</text>
<line class="fg thin" x1="116.00" y1="238.00" x2="116.00" y2="134.00"/>
<rect class="body" x="110.00" y="223.00" width="12" height="30" rx="3" transform="rotate(0 116.00 238.00)"/>
<rect class="body" x="110.00" y="119.00" width="12" height="30" rx="3" transform="rotate(-22 116.00 134.00)"/>
<line class="a2" x1="116.00" y1="186.00" x2="186.00" y2="148.00" marker-end="url(#ah)"/>
<text class="k2" x="156.00" y="140.00">v</text>
<text class="ts" x="116.00" y="286.00" text-anchor="middle">velocity follows the</text>
<text class="ts" x="116.00" y="301.00" text-anchor="middle">wheels; no tyres at all</text>
<text class="t" x="350.00" y="92.00" text-anchor="middle">Dynamic bicycle</text>
<text class="ts" x="350.00" y="110.00" text-anchor="middle">6 states</text>
<line class="fg thin" x1="350.00" y1="238.00" x2="350.00" y2="134.00"/>
<rect class="body" x="344.00" y="223.00" width="12" height="30" rx="3" transform="rotate(0 350.00 238.00)"/>
<rect class="body" x="344.00" y="119.00" width="12" height="30" rx="3" transform="rotate(-22 350.00 134.00)"/>
<line class="a2" x1="350.00" y1="186.00" x2="420.00" y2="164.00" marker-end="url(#ah)"/>
<text class="k2" x="392.00" y="156.00">v</text>
<line class="ok" x1="350.00" y1="134.00" x2="306.00" y2="134.00" marker-end="url(#ah)"/>
<line class="ok" x1="350.00" y1="238.00" x2="318.00" y2="238.00" marker-end="url(#ah)"/>
<text class="k3" x="300.00" y="128.00" text-anchor="end">F<tspan class="sb" dy="3">y</tspan></text>
<text class="ts" x="350.00" y="286.00" text-anchor="middle">one tyre per axle, making</text>
<text class="ts" x="350.00" y="301.00" text-anchor="middle">force from slip</text>
<text class="t" x="586.00" y="92.00" text-anchor="middle">Double track</text>
<text class="ts" x="586.00" y="110.00" text-anchor="middle">~15 states</text>
<rect class="body" x="562.00" y="140.00" width="48.00" height="92.00" rx="8"/>
<rect class="body" x="542.00" y="119.00" width="12" height="30" rx="3" transform="rotate(-22 548.00 134.00)"/>
<circle class="a1f" cx="548.00" cy="134.00" r="5.00"/>
<rect class="body" x="618.00" y="119.00" width="12" height="30" rx="3" transform="rotate(-22 624.00 134.00)"/>
<circle class="a1f" cx="624.00" cy="134.00" r="8.50"/>
<rect class="body" x="542.00" y="223.00" width="12" height="30" rx="3" transform="rotate(0 548.00 238.00)"/>
<circle class="a1f" cx="548.00" cy="238.00" r="5.50"/>
<rect class="body" x="618.00" y="223.00" width="12" height="30" rx="3" transform="rotate(0 624.00 238.00)"/>
<circle class="a1f" cx="624.00" cy="238.00" r="9.00"/>
<text class="ts" x="586.00" y="286.00" text-anchor="middle">four tyres, four loads;</text>
<text class="ts" x="586.00" y="301.00" text-anchor="middle">disc size is F<tspan class="sb" dy="3">z</tspan></text>
</svg>
