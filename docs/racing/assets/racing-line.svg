<circle class="a2f" cx="472.23" cy="257.77" r="5.00"/>
<text class="k2" x="486.23" y="263.77">geometric apex</text>
<circle class="a1f" cx="442.97" cy="238.41" r="5.00"/>
<text class="k1" x="426.97" y="224.41" text-anchor="end">late apex</text>
<text class="k2" x="52.00" y="316.00">geometric</text>
<text class="ts" x="52.00" y="334.00">the largest radius that fits between</text>
<text class="ts" x="52.00" y="349.00">the boundaries, so the highest</text>
<text class="ts" x="52.00" y="364.00">constant speed through the corner</text>
<text class="k1" x="52.00" y="396.00">late apex</text>
<text class="ts" x="52.00" y="414.00">slower in, but the exit straightens</text>
<text class="ts" x="52.00" y="429.00">sooner, so the following straight</text>
<text class="ts" x="52.00" y="444.00">is driven faster all the way down</text>
</svg>
