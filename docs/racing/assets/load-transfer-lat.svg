<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Lateral load transfer in a corner">
<title>Lateral load transfer in a corner</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<style>
  :root {
    --paper:#ffffff; --fg:#14181d; --muted:#5b6672; --grid:#e3e7ec;
    --accent:#c2410c; --accent2:#1d4ed8; --ok:#15803d; --warn:#a16207;
    --body:#cfd6de; --road:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#11161c; --fg:#e8ecf1; --muted:#93a0ad; --grid:#2a323b;
      --accent:#fb923c; --accent2:#7aa7ff; --ok:#4ade80; --warn:#eab308;
      --body:#2b333c; --road:#1a2027;
    }
  }
  .card { fill: var(--paper); }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .axis { stroke: var(--muted); stroke-width: 1.3; fill: none; }
  .mut  { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .fg   { stroke: var(--fg); stroke-width: 1.6; fill: none; }
  .body { fill: var(--body); stroke: var(--muted); stroke-width: 1.1; }
  .road { fill: var(--road); stroke: var(--grid); stroke-width: 1.1; }
  .a1   { stroke: var(--accent);  stroke-width: 2.2; fill: none; }
  .a2   { stroke: var(--accent2); stroke-width: 2.2; fill: none; }
  .ok   { stroke: var(--ok);      stroke-width: 2.2; fill: none; }
  .a1f  { fill: var(--accent);  stroke: none; }
  .a2f  { fill: var(--accent2); stroke: none; }
  .okf  { fill: var(--ok);      stroke: none; }
  .dash { stroke-dasharray: 7 5; }
  .dot  { stroke-dasharray: 2 4; }
  .thin { stroke-width: 1.2; }
  text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
  .t    { font-size: 13px; }
  .ts   { font-size: 11.5px; fill: var(--muted); }
  .tb   { font-size: 15px; font-weight: 600; }
  .tm   { font-size: 12px; fill: var(--muted); }
  .k1   { font-size: 12px; fill: var(--accent); }
  .k2   { font-size: 12px; fill: var(--accent2); }
  .k3   { font-size: 12px; fill: var(--ok); }
  .sb   { font-size: 0.72em; }
</style>
<rect class="card" x="0" y="0" width="640" height="320" rx="10"/>
<text class="tb" x="22.00" y="28.00">Lateral load transfer</text>
<text class="tm" x="22.00" y="47.00">Rear view, cornering left. Same mechanism; the track replaces the wheelbase.</text>
<line class="axis" x1="112.00" y1="236.00" x2="520.00" y2="236.00"/>
<rect class="body" x="197.00" y="192.00" width="26.00" height="44.00" rx="4"/>
<rect class="body" x="407.00" y="192.00" width="26.00" height="44.00" rx="4"/>
<rect class="body" x="226.00" y="138.00" width="178.00" height="48.00" rx="8"/>
<circle class="a1f" cx="315.00" cy="170.00" r="6.50"/>
<text class="ts" x="303.00" y="175.00" text-anchor="end">CoG</text>
<line class="fg" x1="315.00" y1="170.00" x2="315.00" y2="218.00" marker-end="url(#ah)"/>
<text class="ts" x="323.00" y="214.00">m g</text>
<line class="a1" x1="315.00" y1="170.00" x2="399.00" y2="170.00" marker-end="url(#ah)"/>
<text class="k1" x="357.00" y="160.00" text-anchor="middle">inertia</text>
<line class="ok" x1="420.00" y1="236.00" x2="420.00" y2="112.00" marker-end="url(#ah)"/>
<text class="k3" x="432.00" y="116.00">outer gains</text>
<line class="a2" x1="210.00" y1="236.00" x2="210.00" y2="162.00" marker-end="url(#ah)"/>
<text class="k2" x="198.00" y="166.00" text-anchor="end">inner loses</text>
<line class="grid" x1="482.00" y1="236.00" x2="482.00" y2="170.00"/>
<line class="grid" x1="476.00" y1="236.00" x2="488.00" y2="236.00"/>
<line class="grid" x1="476.00" y1="170.00" x2="488.00" y2="170.00"/>
<text class="ts" x="494.00" y="207.00">h</text>
<line class="grid" x1="210.00" y1="262.00" x2="420.00" y2="262.00"/>
<line class="grid" x1="210.00" y1="256.00" x2="210.00" y2="268.00"/>
<line class="grid" x1="420.00" y1="256.00" x2="420.00" y2="268.00"/>
<text class="ts" x="315.00" y="280.00" text-anchor="middle">t</text>
<text class="t" x="112.00" y="300.00">&#916;F<tspan class="sb" dy="3">z</tspan> = m a<tspan class="sb" dy="3">y</tspan> h / t</text>
<text class="ts" x="250.00" y="300.00">inner wheel reaches zero load at a<tspan class="sb" dy="3">y</tspan> = g t / 2h</text>
</svg>
